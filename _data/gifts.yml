# ---------------------------------------------------------------------------
# Collaborative gift list for the /misc/baby/ pages.
#
# This file is the ONLY thing you edit when money arrives. Totals, percentages
# and remaining amounts are computed at build time from `contributions` --
# never store a precomputed total, it will drift.
#
# Easiest way to record a contribution:   python3 scripts/add-contribution.py
# Validate before pushing:                ruby scripts/validate_gifts.rb
#
# Gift fields
#   id           required, unique, lowercase slug. Used in URL anchors and in
#                the payment reference, so DO NOT change it once it is public.
#   name         required. Shown to visitors and used in the payment reference.
#   name_it      optional Italian override for `name`.
#   description  required.
#   description_it  optional Italian override for `description`.
#   image        optional, e.g. /assets/img/gifts/lovevery.jpg
#                The file must exist or the validator fails the build.
#   link         optional "see the gift" link.
#   target       required, positive number.
#   status       open | funded | closed | hidden
#                  open   - accepting contributions
#                  funded - celebratory state, no contribute button
#                           (also applied automatically once total >= target)
#                  closed - shown, greyed out, no contribute button
#                  hidden - not rendered at all
#
# Contribution fields
#   date       required, YYYY-MM-DD
#   name       required. Use a real name even when show_name is false --
#              it is for your own records, it is not published.
#   amount     required, positive number.
#   show_name  required. false => still counts toward the total, but is
#              displayed as "Anonymous".
#   note       optional, for your eyes only. Never rendered.
# ---------------------------------------------------------------------------

